    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
      html {
        background-color: black;
        width: 1440px;
        margin: 0 auto;
      }

      body {
        width: 1200px;
        place-items: center;
        margin: 0 auto;
      }

      nav {
        position: absolute;
        top: 0;
        width: 1200px;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
      }

      ul {
        list-style: none;
        font-family: "Crimson Pro", serif;
        font-weight: 200;
        font-style: normal;
        font-size: 1.375em;
        margin-left: 0;
        padding-left: 0;
      }

      li {
        display: inline-block;
        margin-right: 80px;
      }

      li:last-child {
        margin-right: 0;
      }

      ul li a {
        color: white;
        text-decoration: none;
      }

      ul li a:hover {
        text-decoration: underline;
      }

      .container {
        position: relative;
        text-align: center;
        margin: 0 auto;
        width: 1200px;
      }

      .header {
        width: 1200px;
        height: 220px;
        margin-top: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header-divider {
        width: 1200px;
        height: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 50px;
      }
      
      .magazine-section {
        display: flex;
        align-items: flex-start;
        gap: 40px;              /* space between image and text */
        margin-top: 20px;
      }
      
      .magazine-left {
        max-width: 800px;
      }
      
      .body-text {
        color: white; 
        text-align: left; 
      }
      
      .body-text h2 {
        font-family: "Crimson Pro", serif;
        font-weight: <weight>;
        font-size: 40px;
        margin-top: 0;
        margin-bottom: 20px;
      }
      
      .body-text p {
        font-family: "Figtree", sans-serif;
        font-size: 20px;
        line-height: 1.4;
        margin-top: 0;
      }


      /* image carousel (code from https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_slideshow) */

      .mySlides {display: none}
      
      .magazine-carousel-container {
        max-width: 800px;
        position: relative;
        margin: 0;
      }

      /* Next & previous buttons */
      .prev,
      .next {
        cursor: pointer;
        position: absolute;
        top: 50%;
        width: auto;
        padding: 16px;
        margin-top: -22px;
        color: white;
        font-weight: bold;
        font-size: 18px;
        transition: 0.6s ease;
        border-radius: 0 3px 3px 0;
        user-select: none;
      }

      /* Position the "previous" button to the left */
      .prev {
        left: 0;
      }
      
      /* Position the "next button" to the right */
      .next {
        right: 0;
        border-radius: 3px 0 0 3px;
      }

      /* On hover, add a black background color with a little bit see-through */
      .prev:hover,
      .next:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }

      /* Number text (1/8) */
      .numbertext {
        color: white;
        font-size: 15px;
        padding: 5px 5px;
        position: absolute;
        top: 0;
        background-color: rgba(0, 0, 0, 0.5);
      }

      /* Dots container aligned with the carousel */
      .carousel-dots {
        max-width: 500px;   
        margin-top: 10px;    
        text-align: center;  
      }
      
      /* The dots/bullets/indicators */
      .dot {
        cursor: pointer;
        height: 15px;
        width: 15px;
        margin: 0 2px;
        background-color: #bbb;
        border-radius: 50%;
        display: inline-block;
        transition: background-color 0.6s ease;
      }

      .active,
      .dot:hover {
        background-color: #717171;
      }

      /* Fading animation */
      .fade {
        animation-name: fade;
        animation-duration: 1.5s;
      }

      @keyframes fade {
        from {
          opacity: .4
        }

        to {
          opacity: 1
        }
      }

      /* On smaller screens, decrease text size */
      @media only screen and (max-width: 300px) {

        .prev,
        .next,
        .text {
          font-size: 11px
        }
      }
    </style>
  </head>
  <body>
    <div class="container">

    <div class="header">
      <img src="photos/Designs-Header.svg" alt="Videography Header" style="width:35%;" align="center">
    </div>

    <div class="header-divider">
      <img src="photos/Header-Divider.svg" alt="Header Divider" style="width:100%;" align="center">
    </div>
      
      <div class="magazine-section">
        
      <div class=".magazine-left">
        
  
      <div class="magazine-carousel-container">

<div class="mySlides fade">
  <div class="numbertext">1 / 8</div>
  <img src="photos/magazine-1.jpg" alt="Magazine Page 1" style="width:100%">
</div>

<div class="mySlides fade">
  <div class="numbertext">2 / 8</div>
  <img src="photos/magazine-2.jpg" alt="Magazine Page 2" style="width:100%">
</div>

<div class="mySlides fade">
  <div class="numbertext">3 / 8</div>
  <img src="photos/magazine-3.jpg" alt="Magazine Page 3" style="width:100%">
</div>
        
<div class="mySlides fade">
  <div class="numbertext"> 4 / 8</div>
  <img src="photos/magazine-4.jpg" alt="Magazine Page 4" style="width:100%">
</div>
        
<div class="mySlides fade">
  <div class="numbertext"> 5 / 8</div>
  <img src="photos/magazine-5.jpg" alt="Magazine Page 5" style="width:100%">
</div>
        
<div class="mySlides fade">
  <div class="numbertext"> 6 / 8</div>
  <img src="photos/magazine-6.jpg" alt="Magazine Page 6" style="width:100%">
</div>
        
<div class="mySlides fade">
  <div class="numbertext"> 7 / 8</div>
  <img src="photos/magazine-7.jpg" alt="Magazine Page 7" style="width:100%">
</div>
        
<div class="mySlides fade">
  <div class="numbertext"> 8 / 8</div>
  <img src="photos/magazine-8.jpg" alt="Magazine Page 8" style="width:100%">
</div>

<a class="prev" onclick="plusSlides(-1)">❮</a>
<a class="next" onclick="plusSlides(1)">❯</a>

</div>
<br>

<div class="carousel-dots">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
  <span class="dot" onclick="currentSlide(4)"></span> 
  <span class="dot" onclick="currentSlide(5)"></span> 
  <span class="dot" onclick="currentSlide(6)"></span> 
  <span class="dot" onclick="currentSlide(7)"></span> 
  <span class="dot" onclick="currentSlide(8)"></span> 
</div>
    

<script>
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}
</script>
